
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#064e3b">
    <title>Create Account | Jove EMS</title>

    <link rel="stylesheet" href="register.css">
    <script src="register.js" defer></script>
</head>

<body>
    <main class="register-container">
        <div class="brand">
            <div class="brand-icon" aria-hidden="true">J</div>
            <p class="brand-name">JOVE MULTISYSTEMS</p>
            <p class="brand-subtitle">Energy Management System</p>
        </div>

        <header class="page-heading">
            <h1>Create Your Account</h1>
            <p>Register to access the Jove EMS platform.</p>
        </header>

        <form id="registerForm">
            <div class="form-group">
                <label for="full_name">Full Name</label>
                <input
                    type="text"
                    id="full_name"
                    name="full_name"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    maxlength="100"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    autocomplete="email"
                    maxlength="255"
                    required
                >
            </div>

            <div class="form-group">
                <label for="company">Company Name <span class="optional">(Optional)</span></label>
                <input
                    type="text"
                    id="company"
                    name="company"
                    placeholder="Enter your company name"
                    autocomplete="organization"
                    maxlength="150"
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Minimum 12 characters"
                    autocomplete="new-password"
                    minlength="12"
                    maxlength="128"
                    aria-describedby="passwordHint"
                    required
                >
                <small id="passwordHint">
                    Use at least 12 characters.
                </small>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Re-enter your password"
                    autocomplete="new-password"
                    minlength="12"
                    maxlength="128"
                    required
                >
            </div>

            <div id="message" class="message" role="status"
                 aria-live="polite" hidden></div>

            <button type="submit" id="registerButton">
                Create Account
            </button>
        </form>

        <p class="login-link">
            Already have an account?
            <a href="/login">Sign in</a>
        </p>

        <footer class="footer">
            Clean Energy | Sustainable Future
        </footer>
    </main>
</body>
</html>
